schema = 1

[project]
repository = "."
database = ".taskfleet/state.sqlite"
worktree_root = "../.taskfleet-worktrees"
cas_root = ".taskfleet/cas"
workspace_provider = "git-worktree"
cas_retention_seconds = 604800
# max_parallel_workspaces = 4
# retain_integration_worktree = false
# cas_max_bytes = 10737418240
# [project.shared_caches]
# pnpm_store = "../.caches/pnpm"
# nuget_packages = "../.caches/nuget"
# cargo_home = "../.caches/cargo"
# sccache_dir = "../.caches/sccache"

[[view]]
id = "all"
filter = { op = "true" }

# Linked objectives share an arbitrary meta path (conventionally meta.bundle).
# Roles stay free-form in meta.role — not a core type.
# [[view]]
# id = "bundle-example"
# filter = { op = "eq", path = "meta.bundle", value = "example-pack" }

# Workflows are domain-agnostic pipelines. max_runs=0 means unlimited reruns.
# Args merge as workflow.args < step.args < meta.args (run input).
# [[workflow]]
# id = "repeatable-pack"
# max_runs = 0
# args = { language = "en" }
# [[workflow.step]]
# id = "prepare"
# title = "Prepare"
# instruction = "Gather inputs using the resolved args"
# args = { phase = "prepare" }
# [[workflow.step]]
# id = "deliver"
# title = "Deliver"
# instruction = "Produce the final artifact for this run"
