name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, llvm-tools-preview, rustfmt
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-llvm-cov,tokei
      - run: cargo xtask verify

  platform:
    name: ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux x64
            os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - name: Linux ARM64
            os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
          - name: Windows x64
            os: windows-latest
            target: x86_64-pc-windows-msvc
          - name: macOS Apple Silicon
            os: macos-15
            target: aarch64-apple-darwin
          - name: macOS Intel
            os: macos-15-intel
            target: x86_64-apple-darwin
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: ./.github/actions/setup-zig
        if: runner.os == 'Linux'
      - uses: taiki-e/install-action@v2
        if: runner.os == 'Linux'
        with:
          tool: cargo-zigbuild@0.23.0
      - name: Run platform tests
        shell: bash
        run: |
          if ! cargo test --locked --target "${{ matrix.target }}" >platform-test.log 2>&1; then
            tail -n 80 platform-test.log
            message="$(tail -n 40 platform-test.log)"
            message="${message//'%'/'%25'}"
            message="${message//$'\r'/'%0D'}"
            message="${message//$'\n'/'%0A'}"
            echo "::error title=Platform test failure::$message"
            exit 1
          fi
          cat platform-test.log
      - name: Build portable Linux binary
        if: runner.os == 'Linux'
        run: cargo zigbuild --release --locked --target ${{ matrix.target }}.2.17
      - name: Smoke portable Linux binary on Debian 12
        if: runner.os == 'Linux'
        shell: bash
        run: |
          binary="$PWD/target/${{ matrix.target }}/release/taskfleet"
          docker run --rm --volume "$binary:/usr/local/bin/taskfleet:ro" \
            debian:bookworm-slim /usr/local/bin/taskfleet --version
      - name: Build native release binary
        if: runner.os != 'Linux'
        run: cargo build --release --locked --target ${{ matrix.target }}
