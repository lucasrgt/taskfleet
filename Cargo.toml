[package]
name = "taskfleet"
version = "0.1.0"
edition = "2024"
description = "Agent-first task orchestration across trackers, agents, and harnesses"
repository = "https://github.com/lucasrgt/taskfleet"
license = "MIT"
readme = "README.md"

[workspace]
members = ["xtask"]
resolver = "3"

[[bin]]
name = "taskfleet"
path = "src/main.rs"

[dependencies]
anyhow = "1"
rusqlite = { version = "0.40", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11.0"
tempfile = "3"
toml = "1"
wait-timeout = "0.2"

[dev-dependencies]
assert_cmd = "2"
predicates = "3"

